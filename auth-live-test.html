<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>orbit live auth test</title></head>
<body><pre id="out">pending</pre>
<script src="firebase-config.js"></script>
<script type="module">
const out = document.getElementById('out');
const write = (t) => { out.textContent = t; document.title = 'RESULT:' + String(t).slice(0, 60); };
(async () => {
  try {
    if (!window.ORBIT_FIREBASE_CONFIG) return write('FAIL no config');
    const [{ initializeApp }, authMod, firestore] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
    ]);
    const app = initializeApp(window.ORBIT_FIREBASE_CONFIG);
    const auth = authMod.getAuth(app);
    const db = firestore.getFirestore(app);
    const email = 'orbit-livetest-' + Date.now() + '@example.com';
    const cred = await authMod.createUserWithEmailAndPassword(auth, email, 'live-test-pass-1');
    write('STEP1 signup ok uid=' + cred.user.uid);
    const ref = firestore.doc(db, 'users', cred.user.uid, 'tasks', 'livetest');
    await firestore.setDoc(ref, { title: 'live test task', dueDate: '2026-08-10', type: 'Homework', createdAt: 1 });
    write('STEP2 write ok');
    const snap = await firestore.getDoc(ref);
    write('STEP3 read ok title=' + (snap.exists() ? snap.data().title : 'NONE'));
    await firestore.deleteDoc(ref);
    write('STEP4 cleanup ok');
    try {
      await authMod.deleteUser(cred.user);
      write('RESULT ALL-PASS (account deleted)');
    } catch (e2) {
      write('RESULT ALL-PASS (account cleanup pending: ' + e2.code + ')');
    }
  } catch (err) {
    write('FAIL ' + err.code + ' ' + String(err.message).slice(0, 90));
  }
})();
</script>
</body></html>
