<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbit — Productivity Board</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink: '#090b12', panel: '#111521', line: '#242a3a', violet: '#8b5cf6' }, boxShadow: { glow: '0 0 32px rgba(139, 92, 246, .13)' } } } }
  </script>
  <style>
    body { background: #090b12; }
    .grid-bg { background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px); background-size: 30px 30px; }
    .column { min-height: 565px; background: linear-gradient(155deg, rgba(25,30,44,.92), rgba(13,16,26,.92)); }
    .task-card { transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
    .task-card:hover { transform: translateY(-2px); border-color: rgba(139,92,246,.62); box-shadow: 0 10px 25px rgba(0,0,0,.2); }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .75; }
    input, select { color-scheme: dark; }
  </style>
</head>
<body class="min-h-screen font-sans text-slate-100 grid-bg">
  <main class="mx-auto max-w-[1720px] px-4 py-5 sm:px-5 sm:py-8 lg:px-9">
    <header class="mb-7 flex flex-col justify-between gap-5 sm:flex-row sm:items-center">
      <div>
        <div class="mb-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-[.22em] text-violet-300"><span class="h-2 w-2 rounded-full bg-violet-400 shadow-[0_0_12px_#a78bfa]"></span> Personal command center</div>
        <h1 class="text-3xl font-bold tracking-tight text-white sm:text-4xl">Orbit Board</h1>
        <p id="dateLabel" class="mt-1 text-sm text-slate-400"></p>
      </div>
      <div class="flex w-full items-center justify-between gap-3 sm:w-auto sm:justify-start">
        <span id="syncStatus" class="hidden rounded-full border border-slate-700 bg-slate-900/70 px-3 py-1.5 text-xs text-slate-400 sm:inline-block">Guest mode</span>
        <button id="accountBtn" class="rounded-xl border border-violet-400/30 bg-violet-500/10 px-4 py-2.5 text-sm font-medium text-violet-200 transition hover:bg-violet-500/20">Sign in</button>
      </div>
    </header>

    <section class="mb-6 rounded-2xl border border-line bg-panel/90 p-4 shadow-glow sm:p-5">
      <form id="taskForm" class="grid gap-3 lg:grid-cols-[minmax(220px,1.7fr)_180px_180px_auto] lg:items-end">
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Task title
          <input id="title" required maxlength="120" placeholder="What needs your attention?" class="mt-2 h-11 w-full rounded-xl border border-slate-700 bg-slate-950/70 px-3 text-sm outline-none transition placeholder:text-slate-600 focus:border-violet-400" />
        </label>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Due date
          <input id="dueDate" required type="date" class="mt-2 h-11 w-full rounded-xl border border-slate-700 bg-slate-950/70 px-3 text-sm outline-none transition focus:border-violet-400" />
        </label>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Task type
          <select id="type" class="mt-2 h-11 w-full rounded-xl border border-slate-700 bg-slate-950/70 px-3 text-sm outline-none transition focus:border-violet-400"><option>Homework</option><option>Quiz/Exam</option><option>Event</option></select>
        </label>
        <button class="h-11 rounded-xl bg-violet-500 px-5 text-sm font-bold text-white shadow-lg shadow-violet-950/50 transition hover:bg-violet-400 focus:ring-2 focus:ring-violet-300">Add task <span aria-hidden="true">+</span></button>
      </form>
    </section>

    <section class="mb-5 flex flex-wrap items-center justify-between gap-3">
      <div id="filters" class="-mx-1 flex w-[calc(100%+0.5rem)] gap-2 overflow-x-auto px-1 pb-1 sm:mx-0 sm:w-auto sm:flex-wrap sm:overflow-visible sm:px-0" aria-label="Filter task category">
        <button data-filter="All" class="filter active rounded-full border border-violet-400 bg-violet-500 px-4 py-2 text-xs font-semibold text-white">Show all</button>
        <button data-filter="Homework" class="filter rounded-full border border-slate-700 bg-slate-900/70 px-4 py-2 text-xs font-semibold text-slate-300 hover:border-slate-500">Only homework</button>
        <button data-filter="Quiz/Exam" class="filter rounded-full border border-slate-700 bg-slate-900/70 px-4 py-2 text-xs font-semibold text-slate-300 hover:border-slate-500">Only quizzes/exams</button>
        <button data-filter="Event" class="filter rounded-full border border-slate-700 bg-slate-900/70 px-4 py-2 text-xs font-semibold text-slate-300 hover:border-slate-500">Only events</button>
      </div>
      <p id="taskCount" class="text-sm text-slate-500"></p>
    </section>

    <p class="mb-3 text-xs text-slate-500 xl:hidden">Swipe sideways to move between time frames.</p>
    <section class="flex snap-x snap-mandatory gap-4 overflow-x-auto pb-3 xl:grid xl:grid-cols-4 xl:overflow-visible xl:pb-0" aria-label="Productivity board">
      <template id="columnTemplate">
        <article class="column w-[86vw] shrink-0 snap-start rounded-2xl border border-line p-4 sm:w-[430px] xl:w-auto">
          <div class="mb-5 flex items-start justify-between"><div><h2 class="column-title text-base font-bold"></h2><p class="column-note mt-1 text-xs text-slate-500"></p></div><span class="column-count rounded-lg border border-slate-700 bg-slate-950/60 px-2 py-1 text-xs font-semibold text-slate-400">0</span></div>
          <div class="rows space-y-5"></div>
        </article>
      </template>
      <div id="board" class="contents"></div>
    </section>
  </main>

  <dialog id="accountDialog" class="w-[min(94vw,470px)] rounded-2xl border border-slate-700 bg-[#101521] p-0 text-slate-100 shadow-2xl backdrop:bg-slate-950/80">
    <div class="p-6 sm:p-7"><div class="flex items-start justify-between gap-5"><div><p class="text-xs font-semibold uppercase tracking-[.18em] text-violet-300">Your Orbit account</p><h2 id="accountTitle" class="mt-1 text-2xl font-bold">Welcome back</h2></div><button id="closeDialog" class="text-2xl text-slate-500 hover:text-white" aria-label="Close">×</button></div>
      <p id="accountIntro" class="mt-3 text-sm leading-6 text-slate-400">Sign in to securely keep your tasks synchronized across your devices.</p>
      <form id="accountForm" class="mt-5 space-y-4"><label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Email address<input id="email" required type="email" autocomplete="email" placeholder="you@example.com" class="mt-2 h-11 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 text-sm outline-none focus:border-violet-400" /></label><label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password<input id="password" required minlength="6" type="password" autocomplete="current-password" placeholder="At least 6 characters" class="mt-2 h-11 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 text-sm outline-none focus:border-violet-400" /></label><p id="accountError" class="hidden text-xs text-rose-300"></p><button id="accountSubmit" class="h-11 w-full rounded-xl bg-violet-500 text-sm font-bold text-white hover:bg-violet-400">Sign in</button></form>
      <div id="accountActions" class="mt-4 flex items-center justify-between gap-3"><button id="modeToggle" type="button" class="text-sm font-medium text-violet-300 hover:text-violet-200">Create an account</button><button id="signOut" type="button" class="hidden text-sm text-slate-400 hover:text-white">Sign out</button></div>
      <button id="forgotPassword" type="button" class="mt-4 block w-full text-center text-sm font-medium text-violet-300 transition hover:text-violet-200">Forgot password?</button>
      <div id="resetFlow" class="mt-5 hidden">
        <form id="resetForm" class="space-y-4"><label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Email address<input id="resetEmail" required type="email" autocomplete="email" placeholder="you@example.com" class="mt-2 h-11 w-full rounded-xl border border-slate-700 bg-slate-950 px-3 text-sm outline-none focus:border-violet-400" /></label><button id="resetSubmit" class="h-11 w-full rounded-xl bg-violet-500 text-sm font-bold text-white transition hover:bg-violet-400">Send reset email</button><button id="resetBack" type="button" class="w-full rounded-xl border border-slate-700 bg-slate-900/70 py-2 text-sm font-medium text-slate-300 transition hover:border-slate-500">Back to sign in</button></form>
        <p id="resetNote" class="mt-3 hidden text-sm leading-6 text-slate-400"></p>
      </div>
    </div>
  </dialog>

  <script src="firebase-config.js"></script>
  <script type="module">
    const TYPES = ['Homework', 'Quiz/Exam', 'Event'];
    const COLUMNS = [
      { key: 'past', title: 'Past Due', note: 'Needs a new plan', color: 'text-rose-300' },
      { key: 'today', title: 'Today', note: 'Focus on this now', color: 'text-sky-300' },
      { key: 'week', title: 'This Week', note: 'Next 1–7 days', color: 'text-violet-300' },
      { key: 'upcoming', title: 'Upcoming', note: 'Beyond 7 days', color: 'text-emerald-300' }
    ];
    const TYPE_STYLE = { Homework: 'border-blue-400/20 bg-blue-400/10 text-blue-200', 'Quiz/Exam': 'border-fuchsia-400/20 bg-fuchsia-400/10 text-fuchsia-200', Event: 'border-amber-400/20 bg-amber-400/10 text-amber-100' };
    const $ = id => document.getElementById(id);
    // Tasks are private per account: never seeded from localStorage (which could hold
    // another user's leftover guest data on a shared computer). The board starts empty
    // until the signed-in user's cloud tasks arrive.
    let tasks = [];
    // Firebase config lives in firebase-config.js, so end users never have to configure sync.
    const FIREBASE_CONFIG = window.ORBIT_FIREBASE_CONFIG || null;
    let filter = 'All', cloud = null, unsubscribe = null, accountMode = 'signin';

    function dayStart(value = new Date()) { const d = new Date(value); d.setHours(0,0,0,0); return d; }
    function parseDay(dateString) { const [y,m,d] = dateString.split('-').map(Number); return new Date(y, m-1, d); }
    function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function bucket(task) { const diff = Math.round((dayStart(parseDay(task.dueDate)) - dayStart()) / 86400000); return diff < 0 ? 'past' : diff === 0 ? 'today' : diff <= 7 ? 'week' : 'upcoming'; }
    function formatDate(key) { return parseDay(key).toLocaleDateString(undefined, { month:'short', day:'numeric', year: parseDay(key).getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined }); }
    function safe(text) { return String(text).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c])); }
    function render() {
      const board = $('board'); board.innerHTML = '';
      const visible = tasks.filter(t => filter === 'All' || t.type === filter);
      COLUMNS.forEach(column => {
        const node = $('columnTemplate').content.firstElementChild.cloneNode(true);
        node.querySelector('.column-title').textContent = column.title; node.querySelector('.column-title').classList.add(column.color); node.querySelector('.column-note').textContent = column.note;
        const columnTasks = visible.filter(t => bucket(t) === column.key).sort((a,b) => a.dueDate.localeCompare(b.dueDate));
        node.querySelector('.column-count').textContent = columnTasks.length;
        const rows = node.querySelector('.rows');
        TYPES.forEach(type => {
          const rowTasks = columnTasks.filter(t => t.type === type); const row = document.createElement('section');
          row.innerHTML = `<div class="mb-2 flex items-center gap-2"><span class="h-1.5 w-1.5 rounded-full ${type === 'Homework' ? 'bg-blue-400' : type === 'Quiz/Exam' ? 'bg-fuchsia-400' : 'bg-amber-300'}"></span><h3 class="text-[10px] font-bold uppercase tracking-[.16em] text-slate-500">${type}</h3></div><div class="space-y-2"></div>`;
          const list = row.querySelector('div:last-child');
          if (rowTasks.length) rowTasks.forEach(task => { const card = document.createElement('div'); card.className = 'task-card rounded-xl border border-slate-700/80 bg-slate-950/55 p-3'; card.innerHTML = `<div class="flex gap-3"><input data-complete="${task.id}" type="checkbox" class="mt-0.5 h-4 w-4 shrink-0 accent-violet-500" aria-label="Complete ${safe(task.title)}"><div class="min-w-0 flex-1"><p class="break-words text-sm font-medium leading-5 text-slate-100">${safe(task.title)}</p><div class="mt-2 flex items-center justify-between gap-2"><span class="rounded-md border px-1.5 py-0.5 text-[10px] font-semibold ${TYPE_STYLE[type]}">${type}</span><time class="whitespace-nowrap text-[11px] text-slate-500">${formatDate(task.dueDate)}</time></div></div></div>`; list.append(card); });
          else list.innerHTML = '<p class="rounded-lg border border-dashed border-slate-800 px-3 py-2 text-xs text-slate-600">Nothing here</p>';
          rows.append(row);
        }); board.append(node);
      });
      $('taskCount').textContent = `${visible.length} active task${visible.length === 1 ? '' : 's'} shown`;
    }
    function setAccountMode(mode) { accountMode = mode; const creating = mode === 'signup'; $('accountTitle').textContent = creating ? 'Create your account' : 'Welcome back'; $('accountIntro').textContent = creating ? 'Create an account to keep your board private and available on every device.' : 'Sign in to securely keep your tasks synchronized across your devices.'; $('accountSubmit').textContent = creating ? 'Create account' : 'Sign in'; $('modeToggle').textContent = creating ? 'Already have an account? Sign in' : 'Create an account'; $('password').autocomplete = creating ? 'new-password' : 'current-password'; }
    function showAccountError(message) { $('accountError').textContent = message; $('accountError').classList.remove('hidden'); }
    async function save(task) { if (!cloud?.user) { $('accountDialog').showModal(); throw new Error('Sign in required'); } await cloud.addDoc(cloud.collection(cloud.db, 'users', cloud.user.uid, 'tasks'), task); }
    async function complete(id) { if (!cloud?.user) return; await cloud.deleteDoc(cloud.doc(cloud.db, 'users', cloud.user.uid, 'tasks', id)); }
    $('taskForm').addEventListener('submit', async e => { e.preventDefault(); const task = { id: crypto.randomUUID(), title: $('title').value.trim(), dueDate: $('dueDate').value, type: $('type').value, createdAt: Date.now() }; if (!task.title || !task.dueDate) return; try { await save(task); e.target.reset(); $('dueDate').value = todayKey(); } catch (err) { if (err.message !== 'Sign in required') { alert('Task could not be saved. Please try again.'); console.error(err); } } });
    $('board').addEventListener('change', e => { const id = e.target.dataset.complete; if (id && e.target.checked) complete(id).catch(err => { alert('Could not update this task.'); console.error(err); }); });
    $('filters').addEventListener('click', e => { const button = e.target.closest('[data-filter]'); if (!button) return; filter = button.dataset.filter; document.querySelectorAll('.filter').forEach(b => b.className = 'filter rounded-full border border-slate-700 bg-slate-900/70 px-4 py-2 text-xs font-semibold text-slate-300 hover:border-slate-500'); button.className = 'filter active rounded-full border border-violet-400 bg-violet-500 px-4 py-2 text-xs font-semibold text-white'; render(); });
    $('dateLabel').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric', year:'numeric' }); $('dueDate').value = todayKey();

    function setResetMode(on) { $('accountForm').classList.toggle('hidden', on); $('accountActions').classList.toggle('hidden', on); $('forgotPassword').classList.toggle('hidden', on); $('resetFlow').classList.toggle('hidden', !on); $('resetForm').classList.remove('hidden'); $('resetNote').classList.add('hidden'); $('accountError').classList.add('hidden'); }
    const dialog = $('accountDialog'); $('accountBtn').onclick = () => { setResetMode(false); $('accountError').classList.add('hidden'); dialog.showModal(); };
    $('closeDialog').onclick = () => dialog.close();
    $('modeToggle').onclick = () => { $('accountError').classList.add('hidden'); setAccountMode(accountMode === 'signin' ? 'signup' : 'signin'); };
    $('accountForm').addEventListener('submit', async e => { e.preventDefault(); if (!cloud) return showAccountError('Accounts are being configured for this site. Please try again shortly.'); try { if (accountMode === 'signup') await cloud.authMod.createUserWithEmailAndPassword(cloud.auth, $('email').value, $('password').value); else await cloud.authMod.signInWithEmailAndPassword(cloud.auth, $('email').value, $('password').value); dialog.close(); } catch (err) { showAccountError(err.code === 'auth/email-already-in-use' ? 'That email already has an account. Try signing in.' : err.code === 'auth/invalid-credential' ? 'Email or password is incorrect.' : err.message.replace('Firebase: ', '')); } });
    $('signOut').onclick = () => { dialog.close(); cloud?.authMod.signOut(cloud.auth); };
    $('forgotPassword').onclick = () => { setResetMode(true); $('resetEmail').focus(); };
    $('resetBack').onclick = () => { setResetMode(false); };
    $('resetForm').addEventListener('submit', async e => { e.preventDefault(); const note = $('resetNote'); const email = $('resetEmail').value.trim(); note.classList.remove('hidden'); if (!cloud) { note.className = 'mt-3 text-sm leading-6 text-rose-300'; note.textContent = 'Account service is not available right now. Please try again shortly.'; return; } if (!email) { note.className = 'mt-3 text-sm leading-6 text-rose-300'; note.textContent = 'Enter the email address for your account.'; return; } try { await cloud.authMod.sendPasswordResetEmail(cloud.auth, email); note.className = 'mt-3 text-sm leading-6 text-slate-300'; note.textContent = `Reset link sent to ${email}. Check your inbox (and spam folder), then come back to sign in.`; $('resetForm').classList.add('hidden'); } catch (err) { note.className = 'mt-3 text-sm leading-6 text-rose-300'; note.textContent = err.code === 'auth/user-not-found' ? 'No account found with that email.' : String(err.message).replace('Firebase: ', '').replace(/\(auth\/[^)]*\)\.?/, '').trim() || 'Could not send the reset email. Please try again.'; } });
    async function connectAccounts(config) { const [{ initializeApp }, authMod, firestore] = await Promise.all([import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'), import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'), import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')]); const app = initializeApp(config); const auth = authMod.getAuth(app), db = firestore.getFirestore(app); cloud = { db, auth, authMod, ...firestore, user: null }; authMod.onAuthStateChanged(auth, user => { if (unsubscribe) unsubscribe(); cloud.user = user; if (!user) { tasks = []; localStorage.removeItem('orbit-local-tasks'); $('syncStatus').textContent = 'Guest mode'; $('accountBtn').textContent = 'Sign in'; $('signOut').classList.add('hidden'); render(); return; } localStorage.removeItem('orbit-local-tasks'); $('syncStatus').textContent = user.email || 'Signed in'; $('accountBtn').textContent = 'Account'; $('signOut').classList.remove('hidden'); unsubscribe = firestore.onSnapshot(firestore.collection(db, 'users', user.uid, 'tasks'), snapshot => { tasks = snapshot.docs.map(d => ({ id:d.id, ...d.data() })); render(); }); }); }
    if (FIREBASE_CONFIG?.projectId) connectAccounts(FIREBASE_CONFIG).catch(() => showAccountError('Account service is unavailable right now.'));
    render();
  </script>
</body>
</html>
